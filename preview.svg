<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0d0f12"/><rect width="236" height="900" fill="#101216"/><rect x="236" width="1054" height="64" fill="#0f1114"/><rect x="1290" width="310" height="900" fill="#111419"/><g fill="none" stroke="#292d33"><path d="M236 0v900M1290 0v900M236 64h1054"/></g><rect x="28" y="20" width="32" height="32" rx="10" fill="#6b9df0"/><text x="40" y="42" font-family="Arial" font-size="18" font-weight="700" fill="#07101e">L</text><text x="72" y="35" font-family="Arial" font-size="16" font-weight="700" fill="#f5f6f8">LeoAi</text><text x="72" y="51" font-family="Arial" font-size="10" fill="#7e8792">Private intelligence workspace</text><rect x="18" y="78" width="198" height="38" rx="11" fill="#191d23" stroke="#303640"/><text x="31" y="102" font-family="Arial" font-size="13" fill="#fff">＋ New notebook</text><text x="28" y="142" font-family="Arial" font-size="10" letter-spacing="1" fill="#747c87">WORKSPACE</text><rect x="18" y="150" width="198" height="34" rx="9" fill="#1b1f25"/><g font-family="Arial" font-size="13" fill="#b5bdc8"><text x="31" y="172" fill="#fff">⌂  Overview</text><text x="31" y="211">▤  Projects</text><text x="31" y="250">◫  Sources</text><text x="31" y="289">◈  Models</text><text x="31" y="328">◎  Memory</text><text x="31" y="367">◇  Librarian</text></g><circle cx="32" cy="830" r="4" fill="#61d391"/><text x="43" y="834" font-family="Arial" font-size="11" fill="#aab2bc">Local engine connected</text><text x="43" y="850" font-family="Arial" font-size="10" fill="#626b77">Ollama · local inference</text><text x="265" y="39" font-family="Arial" font-size="13" fill="#a9b0ba">Workspace / </text><text x="355" y="39" font-family="Arial" font-size="13" font-weight="700" fill="#f3f4f6">Private Cloud Architecture</text><rect x="1080" y="16" width="90" height="29" rx="9" fill="#15181d" stroke="#292d33"/><text x="1092" y="35" font-family="Arial" font-size="11" fill="#b8c0ca">Offline-first</text><rect x="1178" y="16" width="98" height="29" rx="9" fill="#15181d" stroke="#292d33"/><text x="1190" y="35" font-family="Arial" font-size="11" fill="#b8c0ca">✦ Leo Brain</text><text x="330" y="113" font-family="Arial" font-size="10" letter-spacing="1" fill="#7f8995">NOTEBOOK · 04 SOURCES</text><text x="330" y="160" font-family="Arial" font-size="34" font-weight="700" fill="#f5f6f8">Private Cloud Architecture</text><text x="330" y="190" font-family="Arial" font-size="13" fill="#9ca4af">A focused research space for secure, low-latency infrastructure without sending business data to a public AI service.</text><g font-family="Arial" font-size="10" fill="#c0c6ce"><rect x="330" y="220" width="150" height="32" rx="10" fill="#15181d" stroke="#292d33"/><text x="340" y="240">PDF · Architecture Brief</text><rect x="488" y="220" width="140" height="32" rx="10" fill="#15181d" stroke="#292d33"/><text x="498" y="240">MD · Network Notes</text><rect x="636" y="220" width="130" height="32" rx="10" fill="#15181d" stroke="#292d33"/><text x="646" y="240">YAML · BrainSpec</text></g><rect x="330" y="285" width="800" height="345" rx="16" fill="#15181d" stroke="#2a2f36"/><text x="352" y="310" font-family="Arial" font-size="11" fill="#9fa7b1">✦ Leo Brain · synthesis</text><text x="352" y="350" font-family="Arial" font-size="18" font-weight="700" fill="#f5f6f8">What should the first infrastructure layer optimize for?</text><text x="352" y="386" font-family="Arial" font-size="13" fill="#c5cad1">The strongest starting point is a small, observable local control plane. Keep inference,</text><text x="352" y="409" font-family="Arial" font-size="13" fill="#c5cad1">memory, model routing and telemetry on the private network, then add external research</text><text x="352" y="432" font-family="Arial" font-size="13" fill="#c5cad1">as an explicit capability rather than a default dependency.</text><path d="M352 458v62" stroke="#507bc1" stroke-width="2"/><text x="368" y="474" font-family="Arial" font-size="11" fill="#aeb6c1">“Local by default” becomes an architectural boundary: data stays inside the workspace</text><text x="368" y="494" font-family="Arial" font-size="11" fill="#aeb6c1">unless a user deliberately opens an online path.</text><g font-family="Arial" font-size="11"><rect x="1300" y="10" width="82" height="34" rx="8" fill="#1b1f25"/><text x="1322" y="32" fill="#fff">Sources</text><text x="1402" y="32" fill="#7f8894">Brain</text><text x="1480" y="32" fill="#7f8894">Agents</text><text x="1307" y="80" fill="#f5f6f8">Sources in this notebook</text><rect x="1305" y="100" width="275" height="65" rx="11" fill="#15181d" stroke="#292d33"/><text x="1318" y="120" fill="#7f8995">PDF · 14 pages</text><text x="1318" y="141" fill="#dde1e6">Architecture Brief</text><rect x="1305" y="176" width="275" height="65" rx="11" fill="#15181d" stroke="#292d33"/><text x="1318" y="196" fill="#7f8995">MARKDOWN</text><text x="1318" y="217" fill="#dde1e6">Network Notes</text><rect x="1305" y="252" width="275" height="65" rx="11" fill="#15181d" stroke="#292d33"/><text x="1318" y="272" fill="#7f8995">BRAIN SPEC</text><text x="1318" y="293" fill="#dde1e6">Leo Core Router</text><text x="1307" y="360" fill="#f5f6f8">System</text><text x="1307" y="390" fill="#7f8995">GPU utilization</text><rect x="1307" y="407" width="245" height="5" rx="3" fill="#272c33"/><rect x="1307" y="407" width="152" height="5" rx="3" fill="#5e92ed"/><text x="1307" y="430" fill="#7f8995">62% · local acceleration</text></g><rect x="430" y="748" width="760" height="112" rx="16" fill="#14171c" stroke="#353a42"/><text x="452" y="778" font-family="Arial" font-size="13" fill="#7f8895">Ask Leo about your sources…</text><rect x="452" y="813" width="70" height="31" rx="8" fill="#191d23" stroke="#30353d"/><text x="464" y="833" font-family="Arial" font-size="11" fill="#9da6b1">＋ Add</text><rect x="530" y="813" width="108" height="31" rx="8" fill="#191d23" stroke="#30353d"/><text x="541" y="833" font-family="Arial" font-size="11" fill="#9da6b1">⌁ Deep research</text><rect x="1139" y="812" width="32" height="32" rx="9" fill="#e8edf5"/><text x="1150" y="834" font-family="Arial" font-size="14" fill="#11161d">↑</text></svg>